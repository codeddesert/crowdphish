{% extends "base.html" %}
{% load static %}
{% block title %}Analyst login · Crowdphish{% endblock %}
{% block content %}
<section class="panel narrow">
  <img class="solo" src="{% static 'img/user1.png' %}" alt="">
  <h1>Analyst login</h1>
  <p>Clownfish already did the reporting. This door is for the people who score what they brought in.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Enter</button>
  </form>
</section>
{% endblock %}
